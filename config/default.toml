# whispy daemon configuration.
# Copy to $XDG_CONFIG_HOME/whispy/config.toml to override; otherwise these
# defaults are baked into the daemon binary.

[stt]
# whisper-server is launched and supervised by the daemon as a child process.
host = "127.0.0.1"
port = 8181
# Model name (informational) + path to the ggml weights. Set after the Step 1 benchmark.
model = "large-v3-turbo-q5_0"
model_path = "~/.local/share/whisper.cpp/models/ggml-large-v3-turbo-q5_0.bin"
# "auto" lets whisper detect IT/EN per clip (code-switching).
language = "auto"
server_bin = "~/.local/share/whisper.cpp/build/bin/whisper-server"
# Compute backend `whispy-daemon setup whisper` builds whisper-server with:
#   "auto"   = Vulkan if the loader is present, else CPU (default)
#   "vulkan" = force the Vulkan GPU backend (needs libvulkan + a GPU ICD)
#   "cpu"    = CPU only (auto-enables OpenBLAS when `libopenblas` is installed)
# Only read at build time; an already-built binary keeps whatever it was built with.
backend = "auto"
timeout_secs = 30        # hard cap on one /inference request (guards against a hung GPU)

[audio]
rate = 16000
channels = 1
max_clip_secs = 60.0      # auto-stop with error: too_long beyond this
min_clip_ms = 400         # shorter clips are dropped silently
rms_interval_ms = 80      # RMS publish cadence while recording
gain = 1.0                # linear gain on captured samples (mic is quiet; raise for meter)
silence_timeout_ms = 2000      # after speech, auto-stop & transcribe after this much silence (0 = off)
silence_rms_threshold = 0.0015 # RMS (0..1) at/below this counts as silence (mic is quiet: speech median ~0.0024, silence ~0)

[filter]
no_speech_prob_max = 0.6  # drop as low_confidence above this
avg_logprob_min = -1.0    # drop as low_confidence below this
fuzzy_ratio = 0.85        # hallucination blacklist fuzzy-match threshold
# `whispy-daemon setup` seeds this; if missing, the built-in list is used.
hallucinations_path = "~/.config/whispy/hallucinations.toml"

[injection]
mode = "paste"            # "paste" (clipboard+Ctrl+V, GUI apps, keeps accents) | "type" (wtype, works in terminals too)
restore_clipboard_delay_ms = 300
# ydotool keycodes: Ctrl down, V down, V up, Ctrl up.
paste_keys = "29:1 47:1 47:0 29:0"
key_delay_ms = 25         # spacing between ydotool key events (so the held Ctrl registers)

[ipc]
# Empty = use XDG defaults ($XDG_RUNTIME_DIR/whispy/whispy.sock,
# $XDG_RUNTIME_DIR/whispy/state.json).
socket_path = ""
state_path = ""
state_max_hz = 20         # cap state.json writes while recording

[dictionary]
# Bias whisper toward custom words/names (joined into the STT prompt).
vocabulary = []
# Auto-fix recurring mistakes (case-insensitive, whole-word), e.g.:
# corrections = { "wisper" = "whisper", "hyperland" = "Hyprland" }
corrections = {}

[snippets]
# Text-expansion shortcuts. Placeholders: {{DATE}}, {{TIME}}, {{CLIPBOARD}}.
# entries = { "my email" = "me@example.com", "stamp" = "{{DATE}} {{TIME}}" }
entries = {}

[llm]
# OpenAI-compatible chat endpoint. Default = local ollama. Set api_key for cloud.
base_url = "http://127.0.0.1:11434/v1"
model = ""                # empty disables LLM workflows
api_key = ""
timeout_secs = 20

# Optional AI workflows. Each rewrites the transcript before injection.
# Selected by `whispy-client toggle --workflow NAME`, else by matching the
# focused window class against `apps`.
# [[workflow]]
# name = "clean"
# prompt = "Clean up this dictation: fix punctuation and remove filler words. Output only the cleaned text."
# apps = []
# [[workflow]]
# name = "email"
# prompt = "Rewrite this dictation as a polite email body. Output only the text."
# apps = ["thunderbird"]
