name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - name: Package binaries
        run: |
          # The two whispy binaries only. whisper-server and the model are NOT
          # shipped — `whispy-daemon setup` bootstraps them per-machine.
          mkdir -p dist
          cp target/release/whispy-daemon target/release/whispy-client dist/
          cp README.md LICENSE dist/
          tar -czf "whispy-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" -C dist .
          sha256sum whispy-*.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            whispy-*.tar.gz
            SHA256SUMS
